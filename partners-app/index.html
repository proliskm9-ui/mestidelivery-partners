/* ==========================================================================
   MestiDelivery Partners — Minimalist Luxury Edition (v7.0)
   Designed to match MestiDelivery Client App & Official Brand Guidelines.
   Zero AI clichés, pure obsidian surfaces, surgical #21EA7C accents,
   and executive-grade typography (Montserrat + Archivo).
   ========================================================================== */

:root {
  /* Matte Obsidian Palette */
  --bg: #0A0B0E;
  --bg-subtle: #0E1015;
  
  --surface: #12141B;
  --surface-hover: #161922;
  --surface-raised: #181B26;
  --surface-subtle: #14161F;
  --surface-pill: #151720;
  --surface-glass: rgba(18, 20, 27, 0.88);
  
  /* Hairline Precision Borders */
  --border: rgba(255, 255, 255, 0.05);
  --border-subtle: rgba(255, 255, 255, 0.035);
  --border-highlight: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  
  /* Typography Colors */
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #5B6271;
  --text-dim: #3F4452;
  
  /* Official Mesti Brand Colors */
  --brand: #21EA7C;
  --brand-pressed: #00C853;
  --brand-dim: rgba(33, 234, 124, 0.10);
  --brand-border: rgba(33, 234, 124, 0.28);
  --brand-contrast: #041208;

  --emerald: #21EA7C;
  --emerald-dim: rgba(33, 234, 124, 0.10);
  
  --amber: #F59E0B;
  --amber-dim: rgba(245, 158, 11, 0.12);
  
  --crimson: #EF4444;
  --crimson-dim: rgba(239, 68, 68, 0.12);
  
  --sky: #38BDF8;
  --sky-dim: rgba(56, 189, 248, 0.12);
  
  --violet: #A855F7;
  --violet-dim: rgba(168, 85, 247, 0.12);

  /* Typography */
  --font: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-display: "Archivo", "Montserrat", sans-serif;

  /* Insets */
  --tg-safe-top: 16px;
  --tg-safe-bottom: 24px;
  --nav-height: 58px;
}

/* ==========================================================================
   Reset & Native Scroll Physics
   ========================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  height: 100%;
  background-color: var(--bg);
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}

body {
  min-height: 100%;
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-bottom: calc(var(--tg-safe-bottom, 24px) + 84px);
  user-select: none;
  -webkit-user-select: none;
}

input, button, textarea, select {
  font-family: inherit;
  font-size: inherit;
  border: none;
  outline: none;
}

/* ==========================================================================
   Splash / Loader
   ========================================================================== */

.app-splash {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 16px;
  background: var(--bg);
}

.splash-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255, 255, 255, 0.08);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.splash-text {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* ==========================================================================
   App Layout & Top Header (Official Mesti Partners Brandmark)
   ========================================================================== */

.app-wrapper {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
}

.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--tg-safe-top, 12px) + 6px) 16px 12px 16px;
  background: rgba(10, 11, 14, 0.90);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid var(--border);
}

.brand-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.brand-logo-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-logo-img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  flex-shrink: 0;
}

.brand-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 3px;
  line-height: 1;
}

.brand-title-mesti {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 14.5px;
  letter-spacing: -0.01em;
  color: var(--brand);
}

.brand-title-deliv {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14.5px;
  letter-spacing: -0.01em;
  color: #FFFFFF;
}

.brand-title-sub {
  font-family: var(--font);
  font-weight: 600;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: #6B7280;
  margin-left: 3px;
  text-transform: uppercase;
}

.brand-entity-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 30px;
  font-size: 11.5px;
  font-weight: 600;
  color: #94A3B8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-entity-row .entity-dash {
  color: var(--brand);
  font-weight: 800;
}

.entity-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn-quiet {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #13151D;
  border: 1px solid var(--border);
  color: #94A3B8;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.18s ease;
}

.icon-btn-quiet:active {
  transform: scale(0.94);
}

.icon-btn-quiet.is-active {
  color: var(--brand);
  border-color: rgba(33, 234, 124, 0.25);
  background: rgba(33, 234, 124, 0.08);
}

.status-capsule-btn {
  height: 34px;
  padding: 0 12px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #13151D;
  border: 1px solid var(--border);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #94A3B8;
  cursor: pointer;
  transition: all 0.18s ease;
}

.status-capsule-btn:active {
  transform: scale(0.96);
}

.status-capsule-btn.is-online {
  background: rgba(33, 234, 124, 0.08);
  border-color: rgba(33, 234, 124, 0.28);
  color: var(--brand);
}

.status-beacon-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #64748B;
  flex-shrink: 0;
}

.status-capsule-btn.is-online .status-beacon-dot {
  background: var(--brand);
  box-shadow: 0 0 5px rgba(33, 234, 124, 0.7);
}

/* ==========================================================================
   Executive Metric Strip (Replacing Clunky AI Boxes)
   ========================================================================== */

.metrics-strip {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin: 12px 16px 4px 16px;
  padding: 9px 4px;
}

.metric-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  padding: 0 6px;
}

.metric-col:last-child {
  border-right: none;
}

.metric-col-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.metric-col-val {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 800;
  color: #F8FAFC;
  line-height: 1.2;
}

.metric-col-val.highlight {
  color: var(--brand);
}

/* Backward compatibility for legacy row */
.metrics-row {
  display: flex;
  gap: 8px;
  padding: 10px 16px 4px 16px;
}
.metric-tile {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.metric-tile .metric-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.metric-tile .metric-value {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  color: #FFF;
}
.metric-tile .metric-value.highlight {
  color: var(--brand);
}

/* ==========================================================================
   Search Bar & Clean Capsule Filter Chips
   ========================================================================== */

.search-wrap {
  padding: 8px 16px 4px 16px;
}

.search-box {
  display: flex;
  align-items: center;
  height: 44px;
  background: #13151D;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0 14px;
  gap: 10px;
  transition: border-color 0.18s ease;
}

.search-box:focus-within {
  border-color: rgba(33, 234, 124, 0.35);
}

.search-box svg {
  color: var(--brand);
  flex-shrink: 0;
}

.search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #F8FAFC;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-clear {
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 4px;
}

/* Single clean scrollable pill filter row */
.chips-scroll-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px 10px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.chips-scroll-row::-webkit-scrollbar {
  display: none;
}

.filter-pill-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 13px;
  border-radius: 100px;
  background: #13151D;
  border: 1px solid var(--border-subtle);
  color: #8F95A0;
  font-family: var(--font);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.18s ease;
}

.filter-pill-btn:active {
  transform: scale(0.96);
}

.filter-pill-btn.is-active {
  background: #18261E;
  color: var(--brand);
  border-color: rgba(33, 234, 124, 0.30);
  font-weight: 700;
}

.pill-counter {
  font-size: 10px;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.08);
  color: #FFF;
  border-radius: 100px;
  padding: 1px 6px;
  min-width: 16px;
  text-align: center;
}

.filter-pill-btn.is-active .pill-counter {
  background: var(--brand);
  color: #041208;
}

/* Segment nav compatibility */
.segments-nav {
  display: flex;
  gap: 6px;
  padding: 6px 16px;
  background: transparent;
}
.segment-item {
  flex: 1;
  height: 34px;
  border-radius: 100px;
  background: #13151D;
  border: 1px solid var(--border-subtle);
  color: #8F95A0;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.segment-item.is-active {
  background: #18261E;
  color: var(--brand);
  border-color: rgba(33, 234, 124, 0.30);
  font-weight: 700;
}
.badge-count {
  font-size: 10px;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.08);
  color: #FFF;
  border-radius: 100px;
  padding: 1px 6px;
}
.segment-item.is-active .badge-count {
  background: var(--brand);
  color: #041208;
}

/* ==========================================================================
   Orders Feed & Luxury Foodtech Cards
   ========================================================================== */

.feed-container {
  display: flex;
  flex-direction: column;
  padding: 4px 0 16px 0;
}

/* Airy Minimal Empty State */
.empty-wrap {
  padding: 50px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.empty-icon-wrap {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #13151D;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.empty-headline {
  font-size: 15px;
  font-weight: 700;
  color: #E2E8F0;
  margin-bottom: 4px;
}

.empty-detail {
  font-size: 12.5px;
  color: var(--text-muted);
  max-width: 270px;
  line-height: 1.4;
}

/* Card Container */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin: 0 16px 12px 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  transition: transform 0.18s ease;
}

.card.is-new-order {
  border-color: rgba(33, 234, 124, 0.28);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.card-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.order-id {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -0.01em;
}

.order-elapsed {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}

/* Status Tags */
.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 25px;
  padding: 0 10px;
  border-radius: 100px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.status-tag-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.status-tag.status-new,
.status-tag.status-pending {
  background: rgba(33, 234, 124, 0.10);
  color: var(--brand);
  border: 1px solid rgba(33, 234, 124, 0.25);
}

.status-tag.status-confirmed,
.status-tag.status-preparing,
.status-tag.status-delivering,
.status-tag.status-on_the_way {
  background: rgba(56, 189, 248, 0.10);
  color: #38BDF8;
  border: 1px solid rgba(56, 189, 248, 0.25);
}

.status-tag.status-ready {
  background: rgba(245, 158, 11, 0.10);
  color: #F59E0B;
  border: 1px solid rgba(245, 158, 11, 0.25);
}

.status-tag.status-delivered {
  background: rgba(255, 255, 255, 0.06);
  color: #94A3B8;
}

.status-tag.status-cancelled {
  background: rgba(239, 68, 68, 0.10);
  color: #EF4444;
  border: 1px solid rgba(239, 68, 68, 0.25);
}

/* Items List (Airy, No heavy table lines) */
.items-table {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.item-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.item-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.item-qty,
.item-qty-badge {
  background: #171922;
  color: #FFFFFF;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  padding: 2px 6px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  flex-shrink: 0;
}

.item-title {
  font-size: 13.5px;
  font-weight: 600;
  color: #E2E8F0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-cost {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: #94A3B8;
  flex-shrink: 0;
}

/* Note Callout */
.note-callout {
  background: #151822;
  border-left: 2px solid var(--brand);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  color: #CBD5E1;
  margin-bottom: 12px;
  line-height: 1.4;
}

/* Kitchen Card Summary */
.card-summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 10px 0 12px 0;
  border-top: 1px solid var(--border);
}

.card-summary span:first-child {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.total-amount {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 800;
  color: #FFFFFF;
}

/* Courier Vertical Route Block (Official Banner 5a) */
.courier-route-block {
  background: #0E1016;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  position: relative;
}

.route-node {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  position: relative;
  z-index: 2;
}

.route-marker-circle {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--brand);
  background: transparent;
  margin-top: 2px;
  flex-shrink: 0;
}

.route-marker-pin {
  width: 14px;
  height: 14px;
  color: var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  flex-shrink: 0;
}

.route-dash-connector {
  width: 2px;
  height: 18px;
  border-left: 2px dashed rgba(33, 234, 124, 0.35);
  margin-left: 6px;
  margin-top: 2px;
  margin-bottom: 2px;
}

.route-node-content {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.route-node-tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--brand);
  text-transform: uppercase;
}

.route-node-val {
  font-size: 13px;
  font-weight: 600;
  color: #F8FAFC;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Route card compatibility */
.route-card {
  background: #0E1016;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.route-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.route-dot {
  color: var(--brand);
  margin-top: 2px;
}
.route-body {
  display: flex;
  flex-direction: column;
}
.route-type {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--brand);
  text-transform: uppercase;
}
.route-name {
  font-size: 13px;
  font-weight: 600;
  color: #F8FAFC;
}

/* Courier Payout Row */
.courier-payout-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 8px 0;
  margin-bottom: 12px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.payout-tag {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.payout-val {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  color: var(--brand);
}

/* ==========================================================================
   Minimalist Discreet Courier Chip & Avatar System (Zero AI Slop / Clutter)
   ========================================================================== */

.courier-avatar-container {
  position: relative;
  border-radius: 50%;

.courier-details-name {

.courier-left {

.courier-avatar-badge {

.courier-name-col {

.courier-name {

.courier-call-btn {

/* Obsolete details block removed in v8.1 */

/* Timeline Stepper */

  justify-content: space-between;

  margin: 16px 0;
}

}

}

}

/* ==========================================================================
   Floating Frosted Glass Pill Bottom Navigation (From mesti-mobile.png)
   ========================================================================== */

.bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 380px;
  height: 58px;
  border-radius: 100px;
  background: rgba(18, 20, 27, 0.88);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 6px;
  z-index: 1000;
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: transparent;
  border: none;
  color: #64748B;
  cursor: pointer;
  position: relative;
  padding: 6px 12px;
  transition: color 0.18s ease;
}

.tab-btn:active {
  transform: scale(0.94);
}

.tab-btn.is-active {
  color: var(--brand);
}

.tab-btn.is-active::after {
  content: '';
  position: absolute;
  bottom: 1px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--brand);
}

.tab-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.tab-bubble {
  position: absolute;
  top: 1px;
  right: 6px;
  background: var(--brand);
  color: #041208;
  font-size: 9.5px;
  font-weight: 800;
  border-radius: 100px;
  padding: 1px 5px;
  min-width: 15px;
  text-align: center;
}

/* ==========================================================================
   Grouped Apple / Linear Settings & Profile Hub
   ========================================================================== */

.settings-group {
  margin-bottom: 20px;
}

.settings-group-header {

  font-weight: 700;

}

.settings-card {

}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.settings-row:last-child {

}

/* Legacy profile section card compatibility */
.profile-section-title {
  display: flex;
  align-items: center;

.profile-row-toggle {

}

.profile-toggle-info {

}

.profile-toggle-title {

}

.profile-toggle-sub {

}

/* Prep time chips */
.profile-prep-chips {

  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.prep-chip {

  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;

}

.prep-chip:active {

}

.prep-chip.is-active {
  background: #18261E;
  color: var(--brand);
  border-color: rgba(33, 234, 124, 0.35);
  font-weight: 700;
}

/* Courier transport chips */
.transport-chips {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.transport-chip {
  height: 42px;
  border-radius: 14px;
  background: #141620;
  border: 1px solid var(--border);
  color: #94A3B8;
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.18s ease;
}

.transport-chip:active {
  transform: scale(0.96);
}

.transport-chip.is-active {
  background: #18261E;
  color: var(--brand);
  border-color: rgba(33, 234, 124, 0.35);
  font-weight: 700;
}

/* Apple-style Smooth Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #232733;
  transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 100px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: #FFFFFF;
  transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--brand);
}

input:checked + .slider:before {
  transform: translateX(20px);
  background-color: #041208;
}

.btn-test-sound {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border-radius: 100px;

  cursor: pointer;
  margin-top: 6px;
  align-self: flex-start;
}
